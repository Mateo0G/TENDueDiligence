    claim: Robert Sherrick is a former advisory board member (left December 2025) and the pilot investigator -- not a director.
  - id: bank_balance_aug31
    report: [financial]
    all: ['256,5\d\d|\$256\.5|\$256,5']
    claim: The August 31, 2026 bank statements show combined balances of about $256,500.
  - id: nih_awards_by_year
    report: [financial, commercial, executive_summary]
    all: ['318,172', '1,447,789', '1,069,475']
    claim: NIH/NIDA award U44 DA059627 provides Year 1 $318,172, Year 2 $1,447,789 and Year 3 $1,069,475.
  - id: minutes_650k_error
    report: [corp_legal, financial]
    all: ['650,000|\$650K|\$650k']
    claim: Management will correct a $650,000 seed-close figure in the January 2026 board minutes.
  - id: abbott_profiled
    report: [competition, competition_supp]
    all: ['Abbott']
    claim: Abbott is profiled as a competitor.
  - id: lzi_profiled
    report: [competition, competition_supp]
    all: ['LZI|Lin-Zhi']
    claim: Lin-Zhi International (LZI) is profiled as a competitor.
  - id: aegis_profiled
    report: [competition, competition_supp]
    all: ['Aegis']
    claim: Aegis Sciences is profiled as a competitor.
  - id: millennium_profiled
    report: [competition, competition_supp]
    all: ['Millennium']
    claim: Millennium Health is profiled as a competitor.
  - id: five_comparable_exits
    report: [exit_report]
    all: []
    claim: The report lists at least five additional comparable exits, each with an acquirer, a date and a deal value (not "not established").
  - id: exit_path_value_ranges
    report: [exit_report, acquirers, exit_recs, exit_summary]
    all: []
    claim: Each proposed exit path is given a value range in dollars.
  - id: siemens_acquirer
    report: [acquirers, exit_report]
    all: ['Siemens']
    claim: Siemens Healthineers is on the potential acquirer list.
  - id: procisedx_team_overlap
    report: [hr, competition, competition_supp, executive_summary]
    all: ['ProciseDx']
    claim: Several team members previously worked at ProciseDx, which is profiled as a competitor, and the report discloses this overlap.
  - id: antidilution_from_charter
    report: [corp_legal]
    all: []
    claim: The anti-dilution analysis and waiver recommendation are based on the charter's actual broad-based weighted-average provision, not on assumed "typical" terms.

# Statements that must NOT appear anywhere.
forbidden:
  - id: name_leak
    patterns: ['\bZZ\b', 'delete me', 'Stage 2 Test']
  - id: search_cap_wording
    patterns: ['search[- ]tool cap', 'search cap', 'cap was reached', 'search limit']
  - id: tool_failure_wording
    patterns: ['search tool failed', 'tool (failed|was unavailable)', 'not populated', 'Not established']

# Wrong facts: a sentence matching `pattern` is a contradiction unless the
# same sentence also matches `unless` (e.g. a history line that states the
# old figure next to the current one).
contradictions:
  - id: plan_pool_superseded
    pattern: '1,333,333'
    unless: '1,878,661|increased|amend'
  - id: sherrick_director
    pattern: 'Sherrick[^.]{0,160}(board of directors|\bdirector\b|resigned (from )?the board)|(board of directors|\bdirector\b)[^.]{0,160}Sherrick'
    unless: 'advisory'
  - id: charter_unconfirmed
    pattern: 'Third (Amended|A&R)[^.]{0,200}(not (independently )?confirmed|unconfirmed|not confirmed as filed)'
    unless: 'certified'
  - id: fingerstick
    pattern: 'finger-?stick'
    unless: 'whole[- ]blood|replac|amended|instead'

# Documents that ARE in the reference data room: any sentence naming one of
# these together with an absence phrase is a false "missing" claim.
present_documents:
  - id: ira
    patterns: ["Investors.? Rights Agreement"]
  - id: warrants
    patterns: ['warrants? (for|of) (all|the) (seven|7)', '2025A warrants?', 'executed warrants?']
  - id: mcfarland_offer
    patterns: ['McFarland.{0,40}offer letter', 'offer letter.{0,40}McFarland']
  - id: russell_offer
    patterns: ['Russell.{0,40}offer letter', 'offer letter.{0,40}Russell']
  - id: consulting_agreements
    patterns: ['consulting agreements?']
  - id: fy2024_financials
    patterns: ['(FY ?|fiscal )?2024 (financial statements|balance sheet|statement of cash flows)']
  - id: h1_2026_financials
    patterns: ['(June|H1|first half|Jan.{0,12}Jun\w*) 2026 (financial statements|balance sheet|P ?& ?L|financials)']
  - id: carta_409a
    patterns: ['Carta.{0,40}409A', '409A.{0,40}Carta', 'December 2025 409A']
  - id: pct
    patterns: ['PCT (application|filing)']
  - id: assignments
    patterns: ['(patent|invention) assignments?']
  - id: landscape
    patterns: ['patent landscape']

absence_phrases:
  - 'not (in|included in|present in|provided in|found in|located in) the data ?room'
  - 'not (been )?(provided|included|located|found|seen)'
  - '\bmissing\b'
  - '\babsent\b'
  - 'could not (be )?(confirm|verif|locat)'
  - '\bunconfirmed\b'
  - '\bno (executed|signed)\b'
  - 'does not contain'
  - 'were not reviewed'
