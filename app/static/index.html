<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEN Capital Due Diligence Report Generator</title>
<link rel="icon" type="image/png" href="/static/ten-capital-logo.png">
<style>
  /* Palette ported from the TEN Capital Investor Scoring app's design
     system (dark navy + coral/orange gradient + teal accent) so every
     internal TEN tool shares one look. */
  :root {
    --bg: #0d1b32;
    --bg-glow-1: rgba(244, 100, 95, 0.16);
    --bg-glow-2: rgba(245, 167, 66, 0.14);
    --bg-glow-3: rgba(63, 193, 224, 0.20);
    --card-bg: rgba(30, 47, 74, 0.85);
    --card-bg-raised: rgba(38, 58, 90, 0.9);
    --card-border: rgba(255, 255, 255, 0.08);
    --track-bg: rgba(255, 255, 255, 0.07);
    --input-bg: rgba(0, 0, 0, 0.22);
    --text-primary: #eaf1fb;
    --text-secondary: #b6c4dc;
    --text-muted: #8398b8;
    --accent-teal: #3fc1e0;
    --accent-from: #f4645f;
    --accent-to: #f5a742;
    --accent-green: #3ddc97;
    --error-bg: rgba(244, 100, 95, 0.12);
    --error-border: rgba(244, 100, 95, 0.4);
    --error-text: #ff9d98;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-sans: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font-sans);
    background: var(--bg);
    background-image:
      radial-gradient(600px 400px at 8% 0%, var(--bg-glow-1), transparent 60%),
      radial-gradient(600px 400px at 92% 15%, var(--bg-glow-2), transparent 60%),
      radial-gradient(700px 500px at 50% 100%, var(--bg-glow-3), transparent 65%);
    background-attachment: fixed;
    color: var(--text-primary); font-size: 14px;
  }
  header {
    background: rgba(13, 27, 50, 0.7); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--card-border);
    color: #fff; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  header .brand { display: flex; align-items: center; gap: 14px; }
  header .logo {
    display: inline-flex; align-items: center; background: #fff;
    border-radius: 8px; padding: 5px 10px; flex-shrink: 0;
  }
  header .logo img { display: block; height: 26px; width: auto; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); color: var(--accent-teal); font-size: 11px;
    font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
  }
  header .tag::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-teal); box-shadow: 0 0 8px var(--accent-teal);
  }
  .layout { display: flex; min-height: calc(100vh - 56px); }
  .sidebar {
    width: 300px; background: rgba(15, 28, 51, 0.5); border-right: 1px solid var(--card-border);
    padding: 16px; flex-shrink: 0;
  }
  .main { flex: 1; padding: 24px; max-width: 980px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .card h2, .sidebar h2 { font-size: 13px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); font-family: var(--font-mono); font-weight: 600; }
  .card h3 { font-size: 13px; margin: 16px 0 8px; color: var(--text-secondary); font-weight: 600; }
  button {
    background: linear-gradient(90deg, var(--accent-from), var(--accent-to));
    color: #1a1208; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; cursor: pointer; font-weight: 700;
    font-family: var(--font-sans);
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { background: var(--track-bg); color: var(--text-muted); cursor: not-allowed; filter: none; }
  button.secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--card-border); }
  button.secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.06); filter: none; }
  button.danger { background: transparent; color: var(--error-text); border: 1px solid var(--error-border); }
  button.danger:hover:not(:disabled) { background: var(--error-bg); filter: none; }
  input[type=text], input[type=file], textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--card-border); border-radius: 6px;
    font-size: 13px; font-family: inherit; background: var(--input-bg); color: var(--text-primary);
  }
  input[type=text]::placeholder { color: var(--text-muted); }
  textarea { resize: vertical; min-height: 60px; }
  label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 5px; font-family: var(--font-mono); }
  .job-item {
    padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .job-item:hover { background: rgba(255, 255, 255, 0.06); }
  .job-item.active { background: var(--card-bg-raised); box-shadow: inset 2px 0 0 var(--accent-teal); }
  .job-item .meta { font-size: 11px; color: var(--text-muted); }
  .job-item .job-main { min-width: 0; flex: 1; }
  .job-item .job-main > div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-item .delete-btn {
    flex-shrink: 0; background: transparent; border: none; color: var(--text-muted);
    font-size: 15px; padding: 2px 6px; border-radius: 5px; line-height: 1;
  }
  .job-item .delete-btn:hover { color: var(--error-text); background: var(--error-bg); filter: none; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 10px;
    font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-family: var(--font-mono);
  }
  .badge.pending { background: var(--track-bg); color: var(--text-muted); }
  .badge.running { background: rgba(63, 193, 224, 0.15); color: var(--accent-teal); }
  .badge.awaiting_review { background: rgba(245, 167, 66, 0.15); color: var(--accent-to); }
  .badge.completed { background: rgba(61, 220, 151, 0.15); color: var(--accent-green); }
  .badge.failed { background: var(--error-bg); color: var(--error-text); }
  .progress-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .progress-bar { flex: 1; height: 8px; background: var(--track-bg); border-radius: 99px; overflow: hidden; }
  .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent-from), var(--accent-to)); }
  .progress-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .stage-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--card-border); }
  .stage-row:last-child { border-bottom: none; }
  .stage-row .title { flex: 1; font-weight: 600; }
  .stage-row .hint { font-size: 12px; color: var(--text-muted); }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th, table.data td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--card-border); vertical-align: top; }
  table.data th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; font-family: var(--font-mono); }
  .file-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; border-bottom: 1px solid var(--card-border); }
  .file-row:last-child { border-bottom: none; }
  .file-row .cat { font-size: 11px; color: var(--text-muted); text-align: right; }
  .file-row .cat.read { color: #4fb3bf; }
  .file-row .cat.warn { color: #e0a84f; }
  .section-item.level-2 { margin-left: 22px; }
  .section-item.level-1 .head span:first-child { font-weight: 700; }
  .block-editor .block-sub { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 12px; color: var(--text-muted); }
  .block-editor .block-sub input[type=text] { flex: 1; }
  .section-item { border: 1px solid var(--card-border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .section-item .head {
    display: flex; justify-content: space-between; align-items: center; padding: 9px 12px;
    cursor: pointer; font-weight: 600; font-size: 13px;
  }
  .section-item .head:hover { background: rgba(255, 255, 255, 0.04); }
  .section-item .body { padding: 12px; border-top: 1px solid var(--card-border); display: none; }
  .section-item.open .body { display: block; }
  .block-editor { border: 1px solid var(--card-border); border-radius: 6px; padding: 8px; margin-bottom: 8px; background: rgba(0, 0, 0, 0.15); }
  .block-editor .type-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; font-family: var(--font-mono); }
  .block-editor table { width: 100%; border-collapse: collapse; }
  .block-editor table td { border: 1px solid var(--card-border); padding: 2px; }
  .block-editor table input { border: none; width: 100%; font-size: 12px; padding: 4px; background: transparent; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 10px 0; }
  .error-msg { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .score-fill { display: inline-block; width: 50px; }
  a.docx-link { color: var(--accent-teal); font-weight: 600; text-decoration: none; }
  a.docx-link:hover { text-decoration: underline; }
  .muted { color: var(--text-muted); }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  /* A real dataroom is 50+ files -- uncapped, the list pushes the upload
     controls and their status/confirmation far below the fold. */
  #file-list {
    max-height: 300px; overflow-y: auto;
    border: 1px solid var(--card-border); border-radius: 8px; padding: 4px 10px; margin-bottom: 6px;
  }
  .file-list-count { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .selection-note { font-size: 12px; color: var(--text-secondary); margin-top: 6px; font-family: var(--font-mono); }
  .upload-status {
    margin-top: 10px; padding: 12px 14px; border-radius: 8px; font-size: 13px;
    border: 1px solid rgba(63, 193, 224, 0.35); background: rgba(63, 193, 224, 0.07);
  }
  .upload-status.done { border-color: rgba(61, 220, 151, 0.4); background: rgba(61, 220, 151, 0.08); }
  .upload-status.error { border-color: var(--error-border); background: var(--error-bg); color: var(--error-text); }
  .upload-status .row { display: flex; align-items: center; gap: 10px; }
  .upload-status .title { font-weight: 600; color: var(--text-primary); }
  .upload-status.error .title { color: var(--error-text); }
  .upload-status .detail { color: var(--text-muted); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .upload-status.error .detail { color: var(--error-text); }
  .upload-status .checkmark { color: var(--accent-green); font-weight: 700; font-size: 15px; }
  .spinner {
    width: 16px; height: 16px; flex-shrink: 0; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.15); border-top-color: var(--accent-teal);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="logo"><img src="/static/ten-capital-logo.png" alt="TEN Capital Network"></span>
    <h1>Due Diligence Report Generator</h1>
  </div>
  <span class="tag">Internal Tool</span>
</header>

<div class="layout">
  <div class="sidebar">
    <h2 style="margin:0 0 10px;">New Job</h2>
    <label for="new-company">Company name</label>
    <input type="text" id="new-company" placeholder="e.g. Acme Diagnostics">
    <div class="toolbar">
      <button onclick="createJob()">Create Job</button>
    </div>
    <h2 style="margin:20px 0 10px;">Jobs</h2>
    <div id="job-list"></div>
  </div>

  <div class="main" id="main">
    <div class="empty">Select a job from the left, or create a new one to get started.</div>
  </div>
</div>

<script>
const API = "";
let currentJobId = null;
let pollTimer = null;
let openSections = new Set();

async function api(method, path, body, isFormData) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    if (isFormData) {
      opts.body = body;
    } else {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
  }
  const resp = await fetch(API + path, opts);
  if (!resp.ok) {
    let detail;
    try { detail = (await resp.json()).detail; } catch (e) { detail = resp.statusText; }
    throw new Error(detail || `HTTP ${resp.status}`);
  }
  const ct = resp.headers.get("content-type") || "";
  // A 204 (or any empty body) can still carry a stamped application/json
  // content-type with nothing to parse -- check for actual content first,
  // not just the header, so an empty success response doesn't throw.
  if (resp.status === 204) return resp;
  const text = await resp.text();
  if (!text) return resp;
  if (ct.includes("application/json")) return JSON.parse(text);
  return resp;
}

function badge(status) {
  return `<span class="badge ${status}">${status.replace("_", " ")}</span>`;
}

async function loadJobs() {
  const jobs = await api("GET", "/jobs");
  const list = document.getElementById("job-list");
  if (jobs.length === 0) {
    list.innerHTML = '<div class="empty">No jobs yet.</div>';
    return;
  }
  list.innerHTML = jobs.map(j => `
    <div class="job-item ${j.id === currentJobId ? 'active' : ''}">
      <div class="job-main" onclick="selectJob('${j.id}')">
        <div>${escapeHtml(j.company_name)}</div>
        <div class="meta">${j.status}${j.vertical ? ' &middot; ' + j.vertical : ''}</div>
      </div>
      <button class="delete-btn" title="Delete job" onclick="event.stopPropagation(); deleteJob('${j.id}', '${escapeAttr(j.company_name)}')">&times;</button>
    </div>
  `).join("");
}

async function createJob() {
  const input = document.getElementById("new-company");
  const name = input.value.trim();
  if (!name) { alert("Enter a company name first."); return; }
  try {
    const job = await api("POST", "/jobs", { company_name: name });
    input.value = "";
    await loadJobs();
    selectJob(job.id);
  } catch (e) {
    alert("Could not create job: " + e.message);
  }
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

async function deleteJob(id, companyName) {
  if (!confirm(`Delete "${companyName}"? This permanently removes the job, its dataroom files, and every generated section/score. This cannot be undone.`)) return;
  try {
    await api("DELETE", "/jobs/" + id);
    if (id === currentJobId) {
      currentJobId = null;
      if (pollTimer) clearTimeout(pollTimer);
      document.getElementById("main").innerHTML = '<div class="empty">Select a job from the left, or create a new one to get started.</div>';
    }
    await loadJobs();
  } catch (e) { alert("Could not delete job: " + e.message); }
}

async function selectJob(id) {
  currentJobId = id;
  openSections.clear();
  await loadJobs();
  if (pollTimer) clearTimeout(pollTimer);
  await renderJob();
}

function taskCounts(tasks, taskType) {
  const rows = tasks.filter(t => t.task_type === taskType);
  const done = rows.filter(t => t.status === "completed").length;
  const failed = rows.filter(t => t.status === "failed").length;
  return { total: rows.length, done, failed };
}

async function renderJob() {
  if (!currentJobId) return;
  let job, tasks, files;
  try {
    job = await api("GET", "/jobs/" + currentJobId);
    tasks = await api("GET", "/jobs/" + currentJobId + "/tasks");
  } catch (e) {
    document.getElementById("main").innerHTML = `<div class="error-msg">${escapeHtml(e.message)}</div>`;
    return;
  }
  files = job.dataroom_files;

  // The sections/QA/gap bodies below are repopulated by their own async
  // fetch right after this innerHTML replacement -- carry over whatever
  // they already showed instead of resetting to "loading..." every poll
  // tick, or the page visibly collapses to a one-line placeholder and then
  // snaps back to full height a moment later on every single poll (a few
  // seconds apart, this reads as the whole page stuttering up and down).
  const prevSectionsList = document.getElementById("sections-list")?.innerHTML;
  const prevQaBody = document.getElementById("qa-body")?.innerHTML;
  const prevGapBody = document.getElementById("gap-body")?.innerHTML;

  // Reading progress counts files (several are read per task).
  const readTasks = tasks.filter(t => t.task_type === "read_files" || t.task_type === "digest_document");
  const readActive = readTasks.some(t => t.status === "pending" || t.status === "running");
  const digests = {
    total: files.length,
    done: files.filter(f => f.digest_status).length,
    failed: files.filter(f => f.digest_status === "unreadable").length,
  };
  if (!readTasks.length) digests.total = 0;
  const keyFacts = taskCounts(tasks, "key_facts");
  const research = taskCounts(tasks, "research");
  const warm = taskCounts(tasks, "warm_cache");
  const draft = taskCounts(tasks, "draft_section");
  const compile = taskCounts(tasks, "compile_draft");
  const qaOld = taskCounts(tasks, "qa_score"), qaAll = taskCounts(tasks, "qa_all");
  const qa = { total: qaOld.total + qaAll.total, done: qaOld.done + qaAll.done, failed: qaOld.failed + qaAll.failed };
  const reportCard = taskCounts(tasks, "report_card");
  const gap = taskCounts(tasks, "gap_analysis");
  const mitigation = taskCounts(tasks, "mitigation_strategy");
  const finalRender = taskCounts(tasks, "final_render");

  const hasFiles = files.some(f => f.file_kind === "dataroom");
  const stage2Started = draft.total > 0;
  const stage2Tasks = tasks.filter(t => t.stage === 2);
  const stage2Done = stage2Started && stage2Tasks.every(t => t.status === "completed");
  const stage2Active = tasks.some(t => t.stage >= 2 && (t.status === "running"));
  const digestsRunning = readActive;
  const stage3Started = compile.total > 0;
  const stage3Done = job.status === "awaiting_review" || job.status === "completed";
  const approved = !!job.draft_approved_at;
  const stage4Started = qa.total > 0;
  const stage4Done = stage4Started && reportCard.done === 1;
  const stage5Started = gap.total > 0;
  const stage5Done = mitigation.done === 1;
  const stage6Started = finalRender.total > 0;
  const stage6Done = job.status === "completed";
  const anyFailed = tasks.some(t => t.status === "failed");

  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="card">
      <div class="flex-between">
        <div>
          <h2 style="margin-bottom:4px;">${escapeHtml(job.company_name)}</h2>
          <div>${badge(job.status)} ${job.vertical ? `<span class="muted" style="margin-left:8px;">${job.vertical}</span>` : ""}
            <a class="muted" style="margin-left:8px;" href="/jobs/${currentJobId}/usage" target="_blank" title="Claude API spend for this job, by step">API cost so far: $${(job.api_cost_usd || 0).toFixed(2)}</a></div>
        </div>
        <div>
          <a class="docx-link" href="/jobs/${currentJobId}/draft.docx" target="_blank">Preview draft (.docx)</a>
          ${job.status === "completed" ? `<br><a class="docx-link" href="/jobs/${currentJobId}/report.docx" target="_blank">Download final report</a>` : ""}
        </div>
      </div>
    </div>

    <div class="card" id="upload-card">
      <h2>1. Dataroom &amp; Pitch Deck</h2>
      ${files.length === 0 ? `<div id="file-list-empty" class="empty">${emptyFileListText()}</div>` : `
        <div class="file-list-count">${files.length} file${files.length === 1 ? "" : "s"} received${files.length > 8 ? " &middot; scroll to see all" : ""}</div>
        <div id="file-list">
          ${files.map(f => `
            <div class="file-row">
              <span>${escapeHtml(f.original_filename)} ${f.file_kind === "pitch_deck" ? "<em>(pitch deck)</em>" : ""}</span>
              ${fileStatusHtml(f, tasks)}
            </div>
          `).join("")}
        </div>
      `}
      <h3>Upload dataroom files</h3>
      <div class="muted" style="margin-bottom:6px;">Accepts a .zip of the whole dataroom, individual files, or a mix of both &mdash; a zip is extracted and every file inside it is classified individually.</div>
      <input type="file" id="dataroom-input" multiple onchange="onFileChosen('dataroom', this)" ${uploadBusy("dataroom") ? "disabled" : ""}>
      <div id="selection-dataroom" class="selection-note"></div>
      <div class="toolbar">
        ${uploadButtonHtml("dataroom", "uploadDataroom()", "Upload dataroom files")}
      </div>
      <div id="upload-status-dataroom">${uploadStatusHtml("dataroom")}</div>
      <h3>Upload pitch deck <span class="muted" style="text-transform:none;font-weight:400;">(optional)</span></h3>
      <div class="muted" style="margin-bottom:6px;">Skip this if the pitch deck is already included in your dataroom zip.</div>
      <input type="file" id="pitchdeck-input" onchange="onFileChosen('pitchdeck', this)" ${uploadBusy("pitchdeck") ? "disabled" : ""}>
      <div id="selection-pitchdeck" class="selection-note"></div>
      <div class="toolbar">
        ${uploadButtonHtml("pitchdeck", "uploadPitchDeck()", "Upload pitch deck")}
      </div>
      <div id="upload-status-pitchdeck">${uploadStatusHtml("pitchdeck")}</div>
      <h3>Company logo <span class="muted" style="text-transform:none;font-weight:400;">(optional)</span></h3>
      <div class="muted" style="margin-bottom:6px;">${job.has_logo ? "Logo uploaded &mdash; shown on the report's cover page." : "Shown on the report's cover page, above the company name, if provided."}</div>
      <input type="file" id="logo-input" accept="image/*" onchange="onFileChosen('logo', this)" ${uploadBusy("logo") ? "disabled" : ""}>
      <div id="selection-logo" class="selection-note"></div>
      <div class="toolbar">
        ${uploadButtonHtml("logo", "uploadLogo()", job.has_logo ? "Replace logo" : "Upload logo")}
      </div>
      <div id="upload-status-logo">${uploadStatusHtml("logo")}</div>
      <div class="toolbar">
        <button class="secondary" onclick="classifyVertical()" ${!hasFiles ? "disabled" : ""}>
          Classify vertical${job.vertical ? " (reclassify)" : ""}
        </button>
      </div>
    </div>

    <div class="card">
      <h2>2. Pipeline</h2>

      ${anyFailed ? `
        <div class="stage-row">
          <div class="title">Some tasks failed</div>
          <div class="hint">Retrying re-queues every failed task (e.g. after a bug fix) so dependent tasks can finally run.</div>
          <button onclick="retryFailedTasks()">Retry failed tasks</button>
        </div>
      ` : ""}

      <div class="stage-row">
        <div class="title">Read documents</div>
        <div class="hint">${digests.total ? `${digests.done}/${digests.total} documents read${digests.failed ? `, ${digests.failed} failed` : ""}${coverageText(job.coverage)}${digestsRunning ? " &middot; runs automatically after upload" : ""}` : "starts automatically when files are uploaded"}</div>
      </div>
      ${digests.total ? `<div class="progress-row"><div class="progress-bar"><div style="width:${(digests.done/digests.total*100)||0}%"></div></div></div>` : ""}

      <div class="stage-row">
        <div class="title">Stage 2 &mdash; Key facts &amp; draft reports</div>
        <div class="hint">${stage2HintText(digests, readActive, keyFacts, research, warm, draft)}</div>
        ${stage2Started
          ? `<button class="secondary" onclick="restartStage2()" ${stage2Active ? "disabled title='Wait for the running tasks to finish'" : ""}>Restart Stage 2</button>`
          : `<button onclick="runStage('stage2')" ${!hasFiles ? "disabled" : ""}>Start</button>`}
      </div>
      ${draft.total ? `<div class="progress-row"><div class="progress-bar"><div style="width:${(draft.done/draft.total*100)||0}%"></div></div></div>` : ""}

      <div class="stage-row">
        <div class="title">Stage 3 &mdash; Compile draft</div>
        <div class="hint">${stage3Done ? "compiled" : (stage3Started ? "compiling..." : "waiting on Stage 2")}</div>
        <button onclick="runStage('stage3')" ${!stage2Done || stage3Started ? "disabled" : ""}>Start</button>
      </div>

      ${stage3Done ? renderReviewSection(job, prevSectionsList) : ""}

      <div class="stage-row">
        <div class="title">Approve draft</div>
        <div class="hint">${approved ? "approved" : "required before Stage 4 can run"}</div>
        <button onclick="approveDraft()" ${job.status !== "awaiting_review" || approved ? "disabled" : ""}>Approve</button>
      </div>

      <div class="stage-row">
        <div class="title">Stage 4 &mdash; QA &amp; scoring</div>
        <div class="hint">${qa.total ? (qaAll.total ? (qaAll.done ? "all checks scored" : "scoring every check in one pass...") : `${qa.done}/${qa.total} checks`) + `${qa.failed ? `, ${qa.failed} failed` : ""}, report card ${reportCard.done ? "done" : "pending"}` : "waiting on approval"}</div>
        <button onclick="runStage('stage4')" ${!approved || stage4Started ? "disabled" : ""}>Start</button>
      </div>
      ${qa.total ? `<div class="progress-row"><div class="progress-bar"><div style="width:${(qa.done/qa.total*100)||0}%"></div></div></div>` : ""}

      <div class="stage-row">
        <div class="title">Stage 5 &mdash; Gap analysis &amp; mitigation</div>
        <div class="hint">${stage5Done ? "done" : (stage5Started ? "in progress" : "waiting on Stage 4")}</div>
        <button onclick="runStage('stage5')" ${!stage4Done || stage5Started ? "disabled" : ""}>Start</button>
      </div>

      <div class="stage-row">
        <div class="title">Stage 6 &mdash; Final render</div>
        <div class="hint">${stage6Done ? "report ready" : (stage6Started ? "rendering..." : "waiting on Stage 5")}</div>
        <button onclick="runStage('stage6')" ${!stage5Done || stage6Started ? "disabled" : ""}>Start</button>
      </div>
    </div>

    ${qa.total ? `<div class="card" id="qa-card"><h2>QA Scores</h2><div id="qa-body">${prevQaBody || "loading..."}</div></div>` : ""}
    ${stage5Started ? `<div class="card" id="gap-card"><h2>Gap Analysis &amp; Mitigation</h2><div id="gap-body">${prevGapBody || "loading..."}</div></div>` : ""}
  `;

  if (stage3Done) renderSectionsList();
  if (qa.total) renderQaScores();
  if (stage5Started) renderGapAnalysis();

  // Self-rescheduling poll: only keep polling while a stage is actively
  // running. Once a stage finishes, polling stops until the user starts
  // the next one -- this avoids wiping out in-progress section edits with
  // a full re-render during the (often long) human-review pause, where
  // nothing on the server is changing anyway.
  if (pollTimer) clearTimeout(pollTimer);
  const anyInProgress =
    digestsRunning ||
    (stage2Started && !stage2Done) ||
    (stage3Started && !stage3Done) ||
    (stage4Started && !stage4Done) ||
    (stage5Started && !stage5Done) ||
    (stage6Started && !stage6Done);
  if (anyInProgress) pollTimer = setTimeout(renderJob, 4000);
}

function coverageText(c) {
  if (!c || !c.pages_total) return "";
  const by = c.pages_by_method || {};
  let t = ` &middot; ${c.pages_extracted.toLocaleString()}/${c.pages_total.toLocaleString()} pages extracted (${by.ocr || 0} by OCR, ${by.vision || 0} visually)`;
  if (c.short && c.short.length) t += ` &middot; <span style="color:var(--accent-to);">${c.short.length} file${c.short.length === 1 ? "" : "s"} not fully readable</span>`;
  return t;
}

function stage2HintText(digests, readActive, keyFacts, research, warm, draft) {
  if (!draft.total) return "not started";
  if (readActive) return `waiting for documents to be read (${digests.done}/${digests.total})`;
  if (keyFacts.done < keyFacts.total || research.done < research.total) {
    const parts = [];
    if (keyFacts.done < keyFacts.total) parts.push("building the key facts sheet");
    if (research.done < research.total) parts.push("researching competitors, comparables and acquirers on the web");
    return parts.join(" and ") + "...";
  }
  if (warm.done < warm.total) return "preparing the shared evidence for drafting...";
  if (draft.done < draft.total) return `${draft.done}/${draft.total} report parts drafted${draft.failed ? `, ${draft.failed} failed` : ""}`;
  return "checking every \"missing document\" statement against the data room...";
}

const TAG_LABELS = {
  commercial: "commercial", financial: "financial", deal_terms: "deal terms", corporate: "corporate",
  contracts: "contracts", team: "team", ip: "IP", science_tech: "science/tech", manufacturing: "manufacturing",
  regulatory: "regulatory", competition: "competition", exit: "exit",
};

function fileStatusHtml(f, tasks) {
  if (f.digest_status === "unreadable") {
    return `<span class="cat warn" title="Could not be read automatically -- review it manually">unreadable</span>`;
  }
  if (f.digest_status === "duplicate") {
    return `<span class="cat" title="Same content as another file in this dataroom -- read once">duplicate</span>`;
  }
  if (f.digest_status) {
    const tags = (f.tags || []).map(t => TAG_LABELS[t] || t).join(", ");
    const how = f.digest_status === "read_visually" ? "read (incl. OCR)" : "read";
    const pages = f.page_count ? ` &middot; ${f.pages_extracted}/${f.page_count} pp` : "";
    const short = f.page_count && f.pages_extracted < f.page_count;
    return `<span class="cat ${short ? "warn" : "read"}" title="${escapeAttr2(tags)}">${how}${pages}${tags ? " &middot; " + escapeHtml(tags) : ""}</span>`;
  }
  const reading = tasks.some(t => (t.task_type === "read_files" || t.task_type === "digest_document") && (t.status === "pending" || t.status === "running"));
  const state = reading ? "queued to read" : (f.category || "uncategorized");
  return `<span class="cat">${escapeHtml(state)}</span>`;
}

function renderReviewSection(job, prevSectionsList) {
  return `
    <div style="padding:10px 0;">
      <h3>Review &amp; edit sections</h3>
      <div id="sections-list">${prevSectionsList || "loading..."}</div>
    </div>
  `;
}

async function renderSectionsList() {
  const el = document.getElementById("sections-list");
  if (!el) return;
  const sections = await api("GET", "/jobs/" + currentJobId + "/sections");
  el.innerHTML = sections.map(s => `
    <div class="section-item level-${s.heading_level || 1} ${openSections.has(s.section_key) ? 'open' : ''}" id="sec-${cssId(s.section_key)}">
      <div class="head" onclick="toggleSection('${escapeAttr(s.section_key)}')">
        <span>${escapeHtml(s.title)}</span>
        <span class="muted">${s.content.length} block(s)</span>
      </div>
      <div class="body">${openSections.has(s.section_key) ? sectionEditorHtml(s) : ""}</div>
    </div>
  `).join("");
}

function cssId(key) { return key.replace(/[^a-zA-Z0-9]/g, "_"); }
function escapeAttr(s) { return s.replace(/'/g, "\\'"); }

function toggleSection(key) {
  if (openSections.has(key)) openSections.delete(key); else openSections.add(key);
  renderSectionsList();
}

function sectionEditorHtml(s) {
  const blocksHtml = s.content.map((b, i) => blockEditorHtml(b, i)).join("");
  return `
    <label>Title</label>
    <input type="text" id="title-${cssId(s.section_key)}" value="${escapeAttr2(s.title)}">
    <div id="blocks-${cssId(s.section_key)}" style="margin-top:10px;">${blocksHtml}</div>
    <div class="toolbar">
      <button onclick="saveSection('${escapeAttr(s.section_key)}')">Save changes</button>
    </div>
  `;
}
function escapeAttr2(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }

function blockEditorHtml(block, i) {
  // Every editor keeps the block's original JSON, so fields this editor
  // doesn't expose (and block types it doesn't know) survive a save intact.
  const orig = `data-orig="${escapeAttr2(JSON.stringify(block))}"`;
  if (block.type === "paragraph") {
    return `<div class="block-editor" data-type="paragraph" ${orig}>
      <div class="type-label">Paragraph</div>
      <textarea class="block-field">${escapeHtml(block.text)}</textarea>
    </div>`;
  }
  if (block.type === "heading") {
    const lvl = block.level || 3;
    return `<div class="block-editor" data-type="heading" ${orig}>
      <div class="type-label">${lvl === 4 ? "Label" : "Sub-heading"}</div>
      <input type="text" class="block-field" value="${escapeAttr2(block.text)}">
    </div>`;
  }
  if (block.type === "callout") {
    return `<div class="block-editor" data-type="callout" ${orig}>
      <div class="type-label">Summary box</div>
      <div class="block-sub">Label <input type="text" class="block-label" value="${escapeAttr2(block.label || "")}"></div>
      <textarea class="block-field">${escapeHtml(block.text)}</textarea>
    </div>`;
  }
  if (block.type === "bullets") {
    return `<div class="block-editor" data-type="bullets" ${orig}>
      <div class="type-label">${block.numbered ? "Numbered list" : "Bulleted list"} &middot; one item per line</div>
      <textarea class="block-field" rows="${Math.min(12, (block.items || []).length + 1)}">${escapeHtml((block.items || []).join("\n"))}</textarea>
    </div>`;
  }
  if (block.type === "note") {
    return `<div class="block-editor" data-type="note" ${orig}>
      <div class="type-label">Source note</div>
      <input type="text" class="block-field" value="${escapeAttr2(block.text)}">
    </div>`;
  }
  if (block.type === "table") {
    const headerRow = `<tr>${block.headers.map((h, c) => `<td><input value="${escapeAttr2(h)}" data-row="-1" data-col="${c}"></td>`).join("")}</tr>`;
    const bodyRows = block.rows.map((row, r) => `<tr>${row.map((cell, c) => `<td><input value="${escapeAttr2(cell)}" data-row="${r}" data-col="${c}"></td>`).join("")}</tr>`).join("");
    return `<div class="block-editor" data-type="table" data-ncols="${block.headers.length}" ${orig}>
      <div class="type-label">Table</div>
      <div class="block-sub">Caption <input type="text" class="block-label" value="${escapeAttr2(block.caption || "")}"></div>
      <table>${headerRow}${bodyRows}</table>
    </div>`;
  }
  return `<div class="block-editor" data-type="other" ${orig}><div class="type-label">${escapeHtml(block.type || "block")} (not editable here)</div></div>`;
}

function saveSection(sectionKey) {
  const container = document.getElementById("blocks-" + cssId(sectionKey));
  const title = document.getElementById("title-" + cssId(sectionKey)).value;
  const blocks = [];
  container.querySelectorAll(".block-editor").forEach(el => {
    const block = JSON.parse(el.dataset.orig);
    const field = el.querySelector(".block-field");
    const label = el.querySelector(".block-label");
    const type = el.dataset.type;
    if (type === "paragraph" || type === "heading" || type === "note") {
      block.text = field.value;
    } else if (type === "callout") {
      block.text = field.value;
      block.label = label.value;
    } else if (type === "bullets") {
      block.items = field.value.split("\n").map(x => x.trim()).filter(Boolean);
    } else if (type === "table") {
      block.caption = label.value;
      const headers = [];
      const rowsMap = {};
      el.querySelectorAll("table input").forEach(inp => {
        const row = parseInt(inp.dataset.row, 10);
        const col = parseInt(inp.dataset.col, 10);
        if (row === -1) headers[col] = inp.value;
        else { rowsMap[row] = rowsMap[row] || []; rowsMap[row][col] = inp.value; }
      });
      block.headers = headers;
      block.rows = Object.keys(rowsMap).sort((a, b) => a - b).map(r => rowsMap[r]);
    }
    blocks.push(block);
  });
  api("PATCH", "/jobs/" + currentJobId + "/sections/" + encodeURIComponent(sectionKey), { title, blocks })
    .then(() => renderSectionsList())
    .catch(e => alert("Could not save section: " + e.message));
}

// Upload state lives outside the DOM because renderJob() rebuilds the whole
// panel on every poll tick -- each status block is re-rendered from here,
// so progress survives a re-render instead of being wiped mid-upload.
const uploads = {};

function uploadBusy(kind) {
  const u = uploads[kind];
  return !!u && u.jobId === currentJobId && (u.phase === "uploading" || u.phase === "processing");
}

function anyUploadActive() {
  return Object.values(uploads).some(u => u.phase === "uploading" || u.phase === "processing");
}

window.addEventListener("beforeunload", e => {
  if (anyUploadActive()) { e.preventDefault(); e.returnValue = ""; }
});

function formatBytes(n) {
  if (!n) return "0 B";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

function formatElapsed(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const m = Math.floor(s / 60);
  return m ? `${m}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`;
}

function emptyFileListText() {
  return uploadBusy("dataroom")
    ? "Your dataroom is on its way &mdash; files will be listed here once the server has processed them."
    : "No files uploaded yet.";
}

function uploadButtonHtml(kind, onclick, label) {
  const busy = uploadBusy(kind);
  return `<button id="upload-btn-${kind}" data-label="${escapeAttr2(label)}" onclick="${onclick}" ${busy ? "disabled" : ""}>${busy ? "Uploading&hellip;" : escapeHtml(label)}</button>`;
}

function uploadStatusHtml(kind) {
  const u = uploads[kind];
  if (!u || u.jobId !== currentJobId) return "";
  const now = Date.now();
  if (u.phase === "uploading") {
    const pct = u.total ? Math.min(100, Math.floor(u.loaded / u.total * 100)) : 0;
    const elapsed = now - u.startedAt;
    let eta = "";
    if (u.loaded > 0 && u.total && pct < 100 && elapsed > 3000) {
      eta = ` &middot; about ${formatElapsed((u.total - u.loaded) / (u.loaded / elapsed))} left`;
    }
    return `<div class="upload-status">
      <div class="row"><div class="spinner"></div><div class="title">Step 1 of 2 &mdash; Uploading ${escapeHtml(u.label)}: ${pct}%</div></div>
      <div class="progress-row"><div class="progress-bar"><div style="width:${pct}%"></div></div></div>
      <div class="detail">${formatBytes(u.loaded)} of ${formatBytes(u.total)} sent${eta}. Keep this tab open until it finishes.</div>
    </div>`;
  }
  if (u.phase === "processing") {
    return `<div class="upload-status">
      <div class="row"><div class="spinner"></div><div class="title">Step 2 of 2 &mdash; ${u.processingTitle}</div></div>
      <div class="detail">${u.processingDetail} Elapsed: ${formatElapsed(now - u.processingStartedAt)}. Keep this tab open.</div>
    </div>`;
  }
  if (u.phase === "done") {
    return `<div class="upload-status done">
      <div class="row"><span class="checkmark">&#10003;</span><div class="title">${u.doneTitle}</div></div>
      ${u.doneDetail ? `<div class="detail">${u.doneDetail}</div>` : ""}
    </div>`;
  }
  if (u.phase === "error") {
    return `<div class="upload-status error"><div class="title">Upload failed</div><div class="detail">${escapeHtml(u.error)}</div></div>`;
  }
  return "";
}

// Patches just this upload's status block, button and input in place --
// called on every progress event and once a second for the elapsed timer,
// without the cost (or the flicker) of a full renderJob().
function refreshUploadUi(kind) {
  const el = document.getElementById("upload-status-" + kind);
  if (el) el.innerHTML = uploadStatusHtml(kind);
  const busy = uploadBusy(kind);
  const btn = document.getElementById("upload-btn-" + kind);
  if (btn) { btn.disabled = busy; btn.innerHTML = busy ? "Uploading&hellip;" : escapeHtml(btn.dataset.label); }
  const input = document.getElementById(kind + "-input");
  if (input) input.disabled = busy;
  const empty = document.getElementById("file-list-empty");
  if (empty && kind === "dataroom") empty.innerHTML = emptyFileListText();
}

function onFileChosen(kind, input) {
  if (!uploadBusy(kind)) { delete uploads[kind]; refreshUploadUi(kind); }
  const el = document.getElementById("selection-" + kind);
  if (!el) return;
  if (!input.files.length) { el.textContent = ""; return; }
  const files = [...input.files];
  const total = files.reduce((s, f) => s + f.size, 0);
  const name = files.length === 1 ? files[0].name : `${files.length} files`;
  const zip = files.some(f => f.name.toLowerCase().endsWith(".zip"));
  el.textContent = `Selected: ${name} (${formatBytes(total)})${zip ? " — zip will be extracted on the server" : ""}. Click upload to send it.`;
}

// XMLHttpRequest rather than fetch(): fetch has no upload-progress events,
// which is exactly the feedback a multi-hundred-MB dataroom zip needs.
// Two phases: "uploading" while bytes are in flight, then "processing"
// once they've all arrived and the server is extracting/classifying/storing
// them -- the request only resolves after that second phase finishes.
function uploadWithProgress(kind, path, formData, label, totalBytes, processing) {
  const u = uploads[kind] = {
    jobId: currentJobId, phase: "uploading", label,
    loaded: 0, total: totalBytes, startedAt: Date.now(),
    processingTitle: processing.title, processingDetail: processing.detail,
  };
  const ticker = setInterval(() => refreshUploadUi(kind), 1000);
  refreshUploadUi(kind);

  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", API + path);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) { u.loaded = e.loaded; u.total = e.total; }
      refreshUploadUi(kind);
    };
    xhr.upload.onload = () => {
      u.loaded = u.total;
      u.phase = "processing";
      u.processingStartedAt = Date.now();
      refreshUploadUi(kind);
    };
    const fail = message => {
      clearInterval(ticker);
      u.phase = "error";
      u.error = message;
      refreshUploadUi(kind);
      reject(new Error(message));
    };
    xhr.onload = () => {
      let body = null;
      try { body = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status >= 200 && xhr.status < 300) {
        clearInterval(ticker);
        u.phase = "done";
        u.finishedAt = Date.now();
        resolve({ body, u });
      } else if (body && body.detail) {
        fail(String(body.detail));
      } else if (xhr.status === 502 || xhr.status === 504) {
        fail(`The server dropped the connection (HTTP ${xhr.status}) while handling the upload. Some files may have been saved before it stopped — check the file list above before retrying.`);
      } else {
        fail(`The server returned HTTP ${xhr.status}.`);
      }
    };
    xhr.onerror = () => fail("Network error — the upload didn't reach the server, or the connection dropped partway through. Check your connection and try again.");
    xhr.send(formData);
  });
}

function summarizeCategories(files) {
  const counts = {};
  let pitchDecks = 0, uncategorized = 0;
  for (const f of files) {
    if (f.file_kind === "pitch_deck") { pitchDecks++; continue; }
    if (!f.category) { uncategorized++; continue; }
    counts[f.category] = (counts[f.category] || 0) + 1;
  }
  const parts = Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, n]) => `${n} ${cat.replace(/_/g, " ")}`);
  if (pitchDecks) parts.push(`${pitchDecks} pitch deck`);
  let html = escapeHtml(parts.join(" · "));
  if (uncategorized) {
    html += `${html ? " · " : ""}<span style="color:var(--accent-to);">${uncategorized} uncategorized</span>`;
  }
  return html;
}

async function uploadDataroom() {
  const input = document.getElementById("dataroom-input");
  if (!input.files.length) { alert("Choose at least one file."); return; }
  const files = [...input.files];
  const fd = new FormData();
  for (const f of files) fd.append("files", f);
  const totalBytes = files.reduce((s, f) => s + f.size, 0);
  const hasZip = files.some(f => f.name.toLowerCase().endsWith(".zip"));
  const label = files.length === 1 ? files[0].name : `${files.length} files`;
  document.getElementById("selection-dataroom").textContent = "";

  let result;
  try {
    result = await uploadWithProgress("dataroom", "/jobs/" + currentJobId + "/dataroom", fd, label, totalBytes, {
      title: hasZip
        ? "Received &mdash; extracting and classifying the dataroom&hellip;"
        : "Received &mdash; storing and classifying files&hellip;",
      detail: hasZip
        ? "The server is unpacking the zip (and any zips nested inside it), storing every file, and sorting each into a dataroom category. Large datarooms can take a few minutes."
        : "The server is storing each file and sorting it into a dataroom category.",
    });
  } catch (e) { return; }

  const { body, u } = result;
  const received = (body && body.uploaded) || [];
  const skipped = (body && body.skipped_duplicates) || 0;
  const skippedNote = skipped ? ` &middot; ${skipped} duplicate file${skipped === 1 ? "" : "s"} skipped (already in this job)` : "";
  if (received.length === 0 && skipped) {
    u.doneTitle = `No new files &mdash; all ${skipped} were already uploaded to this job`;
    u.doneDetail = "Duplicates are skipped so they aren't read (or paid for) twice.";
  } else if (received.length === 0) {
    u.phase = "error";
    u.error = "The upload arrived, but no usable files were found in it (an empty zip, or only folders and system files).";
  } else {
    u.doneTitle = `Dataroom received &mdash; ${received.length} file${received.length === 1 ? "" : "s"} processed in ${formatElapsed(u.finishedAt - u.startedAt)}`;
    u.doneDetail = summarizeCategories(received) + skippedNote;
  }
  await renderJob();
}

  fd.append("file", file);
  document.getElementById("selection-pitchdeck").textContent = "";

  let result;

    result = await uploadWithProgress("pitchdeck", "/jobs/" + currentJobId + "/pitch-deck", fd, file.name, file.size, {
      title: "Received &mdash; storing the pitch deck&hellip;",

    });

  result.u.doneTitle = `Pitch deck received &mdash; ${escapeHtml(file.name)}`;

}

async function classifyVertical() {

async function runStage(stage) {

    await api("POST", "/jobs/" + currentJobId + "/" + stage);
    await renderJob();
  } catch (e) { alert("Could not start " + stage + ": " + e.message); }
}

async function restartStage2() {
  if (!confirm("Discard the current draft (and any QA / gap analysis after it) and draft the report again from the documents already read? Reading is not repeated.")) return;
  try {
    await api("POST", "/jobs/" + currentJobId + "/stage2/restart");
    openSections.clear();
    await renderJob();
  } catch (e) { alert("Could not restart Stage 2: " + e.message); }
}

async function retryFailedTasks() {
  try {
    const result = await api("POST", "/jobs/" + currentJobId + "/retry-failed-tasks");
    await renderJob();
    if (result.retried === 0) alert("No failed tasks to retry.");
  } catch (e) { alert("Could not retry failed tasks: " + e.message); }
}

async function approveDraft() {
  try {
    await api("POST", "/jobs/" + currentJobId + "/approve-draft");
    await renderJob();
    await renderSectionsList();
  } catch (e) { alert("Could not approve draft: " + e.message); }
}
